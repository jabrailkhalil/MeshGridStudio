name: Scientific audit

on:
  push:
    branches:
      - main
      - audit/scientific-corrections-2026-09-22
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee audit-test-log.txt
      - name: Verify committed scientific artifacts
        run: python verify_artifacts.py
      - name: Package exact tested source snapshot
        if: always()
        run: |
          git rev-parse HEAD > audit-source-sha.txt
          python -m pip freeze > audit-environment.txt
          git archive --format=zip --output=audit-source.zip HEAD
      - name: Upload source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-audit-source
          path: |
            audit-source.zip
            audit-source-sha.txt
            audit-test-log.txt
            audit-environment.txt
          retention-days: 7
