name: Materialize scientific corrections

on:
  push:
    branches:
      - audit/scientific-corrections-2026-09-22
    paths:
      - .github/workflows/materialize-scientific-audit.yml

permissions:
  contents: write

jobs:
  reproduce:
    if: github.ref == 'refs/heads/audit/scientific-corrections-2026-09-22'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source edits with before and after SHA-256 verification
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.audit-transfer/edits.{i}.b64').read_text().strip() for i in range(4))
          payload = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '35779b93b1d873663553c543994e227c9bf4697b5cdc8b4740ffaa7755026649', 'Payload hash mismatch'
          allowed = {'README.md', 'SUPPLEMENTARY.md', 'SCIENTIFIC_AUDIT.md', 'article.tex', 'mesh_gui.py', 'mesh_methods.py', 'mesh_methods_3d.py', 'mesh_geometry_3d.py', 'test_mesh_methods_3d.py', 'test_scientific_regressions.py', 'audit_reproduce.py', 'build_supplementary.py', 'verify_artifacts.py', 'tests/data/positive_corners_negative_sample.json'}
          entries = json.loads(payload)
          assert {e['path'] for e in entries} == allowed
          for entry in entries:
              path = Path(entry['path'])
              before = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest() == entry['old_sha256'], f'Original mismatch: {path}'
              lines = before.decode('utf-8').splitlines(keepends=True)
              for i, j, replacement in reversed(entry['edits']):
                  lines[i:j] = [replacement]
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['new_sha256'], f'Result mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              print('Verified', path)
          PY
      - name: Install pinned numerical and document dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-cyrillic texlive-latex-extra fonts-dejavu-core
      - name: Reproduce numerical series and all regression evidence
        run: |
          python audit_reproduce.py --full
          python -m pip freeze > output/audit/ci_environment.txt
      - name: Compile corrected manuscript
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=output/pdf article.tex > /tmp/article-build-pass1.log
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=output/pdf article.tex > /tmp/article-build-pass2.log
          if grep -E 'Undefined control sequence|LaTeX Error|Missing character:|There were undefined references' /tmp/article-build-pass2.log; then exit 1; fi
      - name: Package and verify the source, results and manuscript
        run: |
          python build_supplementary.py
          python verify_artifacts.py
      - name: Commit only to the isolated audit branch
        run: |
          rm -rf .audit-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md SUPPLEMENTARY.md SCIENTIFIC_AUDIT.md article.tex mesh_gui.py mesh_methods.py mesh_methods_3d.py mesh_geometry_3d.py test_mesh_methods_3d.py test_scientific_regressions.py audit_reproduce.py build_supplementary.py verify_artifacts.py tests/data .audit-transfer
          git add -f output/generated output/audit output/pdf/article.pdf output/article-supplementary-materials.zip
          git commit -m 'Fix 3D scientific metrics, functional attribution and reproducible manuscript'
          git push origin HEAD:audit/scientific-corrections-2026-09-22
          git rev-parse HEAD > /tmp/audit-verified-commit.txt
          git archive --format=zip --output=/tmp/MeshGridStudio-audited-source.zip HEAD
      - name: Upload tested scientific deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-audit-corrected
          path: |
            output/article-supplementary-materials.zip
            output/pdf/article.pdf
            output/audit/verification.json
            output/audit/tests.txt
            /tmp/audit-verified-commit.txt
            /tmp/MeshGridStudio-audited-source.zip
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-audit-failure
          path: |
            output/audit
            /tmp/article-build-pass1.log
            /tmp/article-build-pass2.log
          retention-days: 7
