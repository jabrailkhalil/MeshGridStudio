name: Tests

on:
  push:
  pull_request:

jobs:
  numerical-and-gui-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the complete test suite
        run: python -m unittest -v test_mesh_methods.py test_mesh_gui.py
